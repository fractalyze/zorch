name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Both test jobs run a CPU leg and (when a GPU runner exists) a GPU leg on
# self-hosted runners. Label runners by capability, not role: a CPU-only box is
# `[self-hosted, cpu]`; a GPU box is `[self-hosted, cpu, gpu]` (it serves CPU
# work too), so the CPU leg never starves when the CPU-only box is busy/offline.
# The `setup` job adds the GPU leg only when the `HAS_GPU_RUNNER` repo variable
# is `true`, so without GPU hardware the leg is absent, not queued forever. (A
# job-level `if` can't read `matrix`, hence the dynamic matrix.)
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # Strict `cuda` on the GPU leg (no cpu fallback) so a green run really
        # ran on GPU. `needs_cpu_backend` tests get a separate `cuda,cpu` pass.
        run: |
          # Per-leg bazel flags: CPU leg runs on the Buildbarn pool
          # (`--config=remote` + machine-local mTLS certs); the GPU leg runs
          # local (pool is CPU-only), so its `rbe` is empty.
          rbe_cpu='--config=remote --tls_certificate=/etc/rbe-certs/ca.pem --tls_client_certificate=/etc/rbe-certs/client.pem --tls_client_key=/etc/rbe-certs/client.key'
          cpu='{"backend":"cpu","runs_on":["self-hosted","cpu"],"jax_platforms":"cpu","rbe":"'"${rbe_cpu}"'"}'
          gpu='{"backend":"gpu","runs_on":["self-hosted","gpu"],"jax_platforms":"cuda","rbe":""}'
          include="${cpu}"
          if [ "${{ vars.HAS_GPU_RUNNER }}" = "true" ]; then
            include="${cpu},${gpu}"
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  build-and-test:
    # Explicit name; else GitHub appends every matrix value (incl. the long
    # --config=remote + cert-path rbe flags) to the auto-generated job name.
    name: build-and-test (${{ matrix.backend }})
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      # No setup-bazel: it clobbers the box's ~/.bazelrc (self-hosted runners
      # already persist bazel + caches). `.bazelrc.ci` drops the `local_only`
      # tests CI's wheel can't run.
      #
      # GPU leg = two passes: strict `cuda` for the bulk, then `cuda,cpu` for
      # `needs_cpu_backend` — tests that split one computation across both
      # devices, so strict `cuda` leaves them with no CPU backend to reach. Two
      # ways that happens: an op pair where one half legalizes CPU-only
      # (lax.pairing_check beside the GPU-only lax.msm), and a test that runs a
      # host path and a device path side by side to compare them. Prealloc-off
      # avoids a spurious OOM once the CPU backend also inits. CLI
      # `--test_tag_filters` *replaces* .bazelrc.ci's, so restate `-local_only`.
      - name: Run bazel test
        run: |
          set -euo pipefail
          if [ "${{ matrix.backend }}" = "gpu" ]; then
            prealloc='--test_env=XLA_PYTHON_CLIENT_PREALLOCATE=false'
            # Both passes run unconditionally, then the step fails if either
            # did. Letting `set -e` stop at the first would make the tagged
            # pass — the only GPU coverage those tests get — silently
            # conditional on every other test being green.
            status=0
            bazel --bazelrc=.bazelrc.ci test ${{ matrix.rbe }} "$prealloc" \
              --test_tag_filters=-local_only,-needs_cpu_backend \
              --test_env=FRX_PLATFORMS=${{ matrix.jax_platforms }} -- //... \
              || status=$?
            bazel --bazelrc=.bazelrc.ci test ${{ matrix.rbe }} "$prealloc" \
              --test_tag_filters=-local_only,needs_cpu_backend \
              --test_env=FRX_PLATFORMS=cuda,cpu -- //... \
              || status=$?
            exit "$status"
          else
            bazel --bazelrc=.bazelrc.ci test ${{ matrix.rbe }} \
              --test_env=FRX_PLATFORMS=${{ matrix.jax_platforms }} -- //...
          fi

      # Capture the runner-local test.log a failed test leaves behind — the CI
      # stream only carries the FAIL summary, not the gtest output.
      - name: Upload bazel test logs
        if: ${{ failure() }}
        uses: fractalyze/.github/.github/actions/upload-bazel-testlogs@main
        with:
          name: bazel-test-logs-${{ matrix.backend }}

  pre-commit:
    if: github.actor != 'fractalyze-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --from-ref ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to-ref HEAD

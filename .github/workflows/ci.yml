name: CI

permissions: read-all

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for PRs (same head branch), but never cancel pushes
# to main so that every merge gets a full CI run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Both test jobs run a CPU leg and (when a GPU runner exists) a GPU leg on
# self-hosted runners. Label runners by capability, not role: a CPU-only box is
# `[self-hosted, cpu]`; a GPU box is `[self-hosted, cpu, gpu]` (it serves CPU
# work too), so the CPU leg never starves when the CPU-only box is busy/offline.
# The `setup` job adds the GPU leg only when the `HAS_GPU_RUNNER` repo variable
# is `true`, so without GPU hardware the leg is absent, not queued forever. (A
# job-level `if` can't read `matrix`, hence the dynamic matrix.)
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        # Strict `cuda` (no cpu fallback) on the GPU leg so a green run means it
        # really ran on GPU; a GPU init failure fails loudly instead of silently
        # passing on CPU.
        run: |
          cpu='{"backend":"cpu","runs_on":["self-hosted","cpu"],"jax_platforms":"cpu"}'
          gpu='{"backend":"gpu","runs_on":["self-hosted","gpu"],"jax_platforms":"cuda"}'
          include="${cpu}"
          if [ "${{ vars.HAS_GPU_RUNNER }}" = "true" ]; then
            include="${cpu},${gpu}"
          fi
          echo "matrix={\"include\":[${include}]}" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.9.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.backend }}
          repository-cache: true
      # The tests that vmap poseidon2's zorch.fused_region composite carry
      # `tags = ["manual"]`, so `//...` skips them here — they need
      # fractalyze/jax#164's batching rule, absent from the pinned jax wheel
      # bazel's hermetic pip resolves. The pytest job runs them against the fork
      # branch. Drop those tags after the jax pin bump.
      - name: Run bazel test
        run: bazel test --test_env=JAX_PLATFORMS=${{ matrix.jax_platforms }} -- //...

  pytest:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_lock_3_11.txt
      - name: Install pinned deps + pytest
        run: |
          pip install -r requirements_lock_3_11.txt
          pip install pytest
      # TEMP — remove once fractalyze/jax#164 merges and the jax-update pin bump
      # lands here. The pinned jax wheel lacks the vmap-over-composite batching
      # rule that poseidon2's zorch.fused_region marker needs; override the jax package
      # with the fork branch (tarball via the read token, since jax is private;
      # pinned to the PR-head commit so CI is reproducible; --no-deps keeps the
      # pinned jaxlib).
      - name: (temp) jax composite-vmap batching rule (fractalyze/jax#164)
        run: |
          mkdir -p "${RUNNER_TEMP}/jax-src"
          curl -fsSL \
            -H "Authorization: token ${{ secrets.FRACTALYZE_REPOS_READ_TOKEN }}" \
            "https://api.github.com/repos/fractalyze/jax/tarball/da27584c20f80c6563234d9234116dd61ec3b293" \
            | tar -xz --strip-components=1 -C "${RUNNER_TEMP}/jax-src"
          pip install --no-deps --force-reinstall "${RUNNER_TEMP}/jax-src"
      - name: Run module tests
        run: JAX_PLATFORMS=${{ matrix.jax_platforms }} PYTHONPATH=. pytest

  pre-commit:
    if: github.actor != 'fractalyze-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          pip install pre-commit
          pre-commit run --from-ref ${{ github.event.pull_request.base.sha || 'HEAD~1' }} --to-ref HEAD

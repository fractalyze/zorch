#
# Publishes a clean, tagged release of zorch to TestPyPI or PyPI. zorch is pure
# Python, so there is no Bazel / native build step and no cibuildwheel matrix:
# one `python -m build` produces a single platform-independent sdist + wheel.
#
# The PyPI *distribution* name is `pyzorch` (set in pyproject.toml) because the
# `zorch` name is taken on PyPI; the *import* package stays `zorch`
# (`import zorch`, `[tool.setuptools.packages.find]`). Users therefore
# `pip install pyzorch` but `import zorch`.
#
# Uploads use OIDC "trusted publishing" (pypa/gh-action-pypi-publish): no API
# tokens are stored in the repo. Each target is gated on a GitHub environment
# (`testpypi` / `pypi`) and mints a short-lived OIDC token via
# `permissions: id-token: write`. This requires a one-time PyPI-side setup — a
# trusted publisher registered for project `pyzorch` on BOTH test.pypi.org and
# pypi.org, pointing at this repo + this workflow file (publish.yml) + the
# matching environment name.
#
# The frx (Field, Ring Accelerated) stack (frx / frxlib / frx-cuda12-* /
# zk-dtypes) is intentionally NOT a declared dependency of the wheel (see the
# comment in pyproject.toml): it is a GPU-correctness-sensitive, continuously
# bumped build that the *consuming* workspace pins exactly. Consequently the
# awesome-zorch install docs must instruct users to install the frx stack
# separately alongside `pip install pyzorch`.

name: Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options:
          - testpypi
          - pypi
          - build-only
        default: testpypi

concurrency:
  group: publish
  cancel-in-progress: false

# Least privilege: the build job only reads source and uploads an artifact.
# The publish job overrides this with id-token: write for OIDC trusted publishing.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 3

  publish:
    name: Publish
    if: inputs.target != 'build-only'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: ${{ inputs.target }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyzorch"
dynamic = ["version"]
description = "zorch — scheme- and zkVM-agnostic JAX-native ZK proving blocks (hashing, Merkle commitment, sumcheck, PCS, LogUp-GKR)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Zorch Authors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
]
# `frx` is declared, so `pip install pyzorch` alone is usable: every zorch
# submodule imports it, and without it the package imports but nothing in it
# runs. frxlib and zk-dtypes are not listed because frx already requires them.
#
# The floor carries the `.dev0` sentinel rather than being a plain `>=0.10.0`
# because a consuming workspace pins an exact continuously-bumped dev build and
# `0.10.0.devN` sorts BELOW `0.10.0` — a plain floor would reject the very pin
# requirements.in sets. The floor itself does not conflict with that pin;
# sp1-zorch and groth16-zorch have shipped this combination.
#
# `typing-extensions` is declared for the same reason: `zorch.transcript` imports
# its `TypeVar` at module scope for PEP 696 defaults, which `typing` gains only
# in 3.13, and that module sits on the import path of every scheme seam.
#
# `hash-frx` is the symmetric layer — permutations, sponge, compression, and the
# `fused_region` marker seam. It is a hard runtime dependency, not an optional
# one: `zorch.transcript` and `zorch.commit` import it at module scope, so
# nothing in zorch imports without it. Unpinned here, as frx is, because the
# exact build is a consuming workspace's choice; requirements.in pins it.
#
# The GPU plugins (frx-cuda12-*) stay undeclared: they are an install-time
# platform choice, offered through frx's own `cuda12` extra.
dependencies = [
    "absl-py",
    "numpy",
    "frx>=0.10.0.dev0",
    "hash-frx",
    "typing-extensions",
]

[project.urls]
Repository = "https://github.com/fractalyze/zorch"

[tool.setuptools.dynamic]
version = { attr = "zorch.__version__" }

# Package the runtime tree only. Test-support packages (`*/testing`) are dropped;
# the `testkit` package itself stays (sp1-zorch imports zorch.testkit.transcript).
[tool.setuptools.packages.find]
where = ["."]
include = ["zorch*"]
exclude = ["zorch.testing", "zorch.testing.*", "zorch.*.testing", "zorch.*.testing.*"]

# Python tooling config. zorch builds via Bazel (MODULE.bazel); the tables below
# configure pytest, which runs the `*_test.py` module tests (the bazel side
# covers the toolchain smoke test + the requirements-lock check).
[tool.pytest.ini_options]
testpaths = ["zorch", "tools"]
python_files = ["*_test.py", "test_*.py"]

# Every def carries full type annotations (see docs/reference/conventions.md); mypy's
# disallow_untyped_defs is what enforces it. Run: `mypy` (uses the files below).
[tool.mypy]
python_version = "3.11"
files = ["zorch", "tools"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Untyped (or, for frx, statically unresolvable) third parties:
# frx is an editable build whose own .pyi stubs don't parse under mypy, so its
# types are unusable here — `frx.Array` collapses to Any. zk_dtypes/zkbench ship
# no py.typed; absl only stubs part of its surface. disallow_untyped_defs still
# enforces our own annotations regardless.
[[tool.mypy.overrides]]
module = ["frx.*", "frxlib.*", "zk_dtypes.*", "zkbench.*", "absl.*"]
ignore_missing_imports = true
